name: Dev Release (Firmware)

on:
  workflow_dispatch: {}
  push:
    branches:
      - master
    paths:
      - board/**

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: dev-release-firmware
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: true
          fetch-depth: 0

      - name: Build firmware
        uses: samyarsadat/Pico-Build-Action@v1
        with:
          source_dir: "board"
          output_dir: "../build"
          cmake_args: "-DCMAKE_BUILD_TYPE=Release"

      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp build/project/MSRC-RP2040.uf2 dist/MSRC_firmware.uf2

      - name: Generate attestation
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/MSRC_firmware.uf2
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Write release body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LAST_RELEASE_TAG=$(gh api \
            repos/${{ github.repository }}/releases/latest \
            --jq '.tag_name')

          {
            echo "Development (auto)"
            echo
            echo "Commits since ${LAST_RELEASE_TAG}:"
            echo
            git log "${LAST_RELEASE_TAG}..${{ github.sha }}" \
              --pretty=format:'- [`%h`](https://github.com/${{ github.repository }}/commit/%H) %s'
            echo
          } > release_body.md

      - name: Publish firmware to Development release
        uses: ncipollo/release-action@v1
        with:
          tag: dev-latest
          name: Development (auto)
          prerelease: true
          allowUpdates: true
          commit: ${{ github.sha }}
          artifacts: dist/MSRC_firmware.uf2
          artifactContentType: application/octet-stream
          replacesArtifacts: true
          generateReleaseNotes: false
          bodyFile: release_body.md